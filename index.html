<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roblox Piano Trainer</title>
<style>
:root{
  --bg:#090d16;--panel:#111827;--panel2:#151d2f;--line:#29344c;
  --text:#eef4ff;--muted:#97a5bf;--accent:#7d8cff;--accent2:#a277ff;
  --good:#61d9a5;--bad:#ff728d;--warn:#ffd36c;--shadow:0 16px 44px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#080b12,#0b1120);color:var(--text);
font-family:Pretendard,Inter,system-ui,sans-serif;padding:24px}
.app{max-width:1500px;margin:auto;display:grid;gap:18px}
.hero,.panel{border:1px solid rgba(255,255,255,.07);box-shadow:var(--shadow)}
.hero{border-radius:24px;padding:22px;background:linear-gradient(135deg,rgba(125,140,255,.18),rgba(162,119,255,.09))}
.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--muted)}
.main{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.panel{border-radius:20px;padding:18px;background:linear-gradient(180deg,var(--panel),var(--panel2))}
h2{font-size:18px;margin:0 0 15px}label{display:block;font-size:12px;font-weight:800;color:#dbe5ff;margin:0 0 6px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#0b1221;color:var(--text);
border-radius:13px;padding:11px 12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,140,255,.13)}
textarea{min-height:175px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stack{display:grid;gap:12px}
button{border:0;border-radius:12px;padding:11px 14px;background:#222c43;color:white;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.08)}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2))}
button.danger{background:#44202a;color:#ffd4dc}button.ghost{border:1px solid var(--line);background:#11192a}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
.library-toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
.song-list{display:grid;gap:8px;max-height:430px;overflow:auto;padding-right:4px}
.song-card{border:1px solid var(--line);background:#0c1423;border-radius:14px;padding:12px;cursor:pointer}
.song-card:hover{border-color:#53617d}.song-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(125,140,255,.15)}
.song-title{font-weight:900}.song-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.status{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:end}
.current{font-size:34px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900}
.pill{border:1px solid var(--line);background:#0b1221;border-radius:13px;padding:9px 11px;text-align:center;font-size:12px}
.progress{height:10px;background:#09101d;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.keyboard-shell{margin-top:18px;overflow:auto;background:#090f1b;border:1px solid var(--line);border-radius:20px;padding:16px}
.krow{display:flex;gap:7px;margin-bottom:7px;width:max-content;min-width:100%}
.key{height:54px;min-width:52px;border-radius:12px;background:linear-gradient(180deg,#f5f7ff,#cfd6eb);color:#0e1422;
display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.2);user-select:none}
.key.dark{background:linear-gradient(180deg,#2a344b,#171e31);color:#edf3ff}.key.playable{cursor:pointer}
.key.active{transform:translateY(2px);background:linear-gradient(180deg,#8997ff,#7180ef);color:white;box-shadow:none}
.key.target{outline:3px solid rgba(97,217,165,.85);outline-offset:1px}
.note{font-size:9px;opacity:.65;margin-top:3px}.w70{min-width:70px}.w85{min-width:85px}.w100{min-width:100px}.w120{min-width:120px}.w140{min-width:140px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.info>div{border:1px solid var(--line);background:#0b1221;border-radius:13px;padding:11px}.small{font-size:12px;color:var(--muted)}
.v{font-size:18px;font-weight:900;margin-top:5px}.hint{font-size:12px;color:var(--muted);line-height:1.6}.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.modal{width:min(560px,100%);background:#111827;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
@media(max-width:1050px){.main{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}.info{grid-template-columns:1fr}}
@media(max-width:600px){body{padding:12px}.grid2{grid-template-columns:1fr}.status{grid-template-columns:1fr}.hero h1{font-size:24px}}

.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.sidebar-head h2{margin:0}
.icon-btn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:11px}
.main.library-hidden{grid-template-columns:1fr}
.main.library-hidden aside.panel{display:none}
.library-reopen{display:none;margin-bottom:10px}
.main.library-hidden .library-reopen{display:inline-flex}
.sequence-stage{
  margin-top:20px;
  padding:22px 0 18px;
  overflow:hidden;
  position:relative;
}
.sequence-label{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:14px;
  text-align:center;
  letter-spacing:.04em;
}
.sequence-viewport{
  overflow:hidden;
  position:relative;
  min-height:104px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 90%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 90%,transparent 100%);
}
.sequence-viewport::before{
  content:"";
  position:absolute;
  left:50%;
  top:4px;
  bottom:4px;
  width:1px;
  background:linear-gradient(180deg,transparent,rgba(125,140,255,.45),transparent);
  transform:translateX(-50%);
  z-index:0;
}
.sequence-track{
  display:flex;
  gap:30px;
  align-items:center;
  min-height:104px;
  padding:0 50%;
  width:max-content;
  transition:transform .34s cubic-bezier(.22,.61,.36,1);
  will-change:transform;
  position:relative;
  z-index:1;
}
.seq-item{
  flex:0 0 auto;
  min-width:72px;
  text-align:center;
  color:#8290aa;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:20px;
  font-weight:700;
  opacity:.22;
  transform:scale(.82);
  filter:blur(.15px);
  transition:
    transform .28s cubic-bezier(.22,.61,.36,1),
    opacity .28s ease,
    color .28s ease,
    filter .28s ease;
  white-space:nowrap;
}
.seq-item.near{
  opacity:.48;
  transform:scale(.9);
  color:#aab5cc;
}
.seq-item.current{
  min-width:120px;
  opacity:1;
  transform:scale(1.18);
  color:#f7f9ff;
  font-size:36px;
  font-weight:1000;
  filter:none;
  text-shadow:0 0 22px rgba(125,140,255,.28);
}
.seq-item.done{
  opacity:.12;
  transform:scale(.76);
}
.seq-item.future{
  opacity:.28;
}
.sequence-marker{
  width:34px;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  margin:2px auto 0;
  border-radius:99px;
  opacity:.95;
  box-shadow:0 0 14px rgba(125,140,255,.35);
}
@media(max-width:650px){
  .modal-grid{grid-template-columns:1fr}
  .sequence-track{gap:20px}
  .seq-item{min-width:58px;font-size:16px}
  .seq-item.current{min-width:92px;font-size:29px}
}


.audio-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}
.range-wrap{
  border:1px solid var(--line);
  background:#0b1221;
  border-radius:14px;
  padding:11px 12px;
}
.range-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.range-head label{margin:0}
.range-value{font-size:12px;font-weight:900;color:#dce5ff}
input[type=range]{padding:0;border:0;background:transparent;box-shadow:none}
@media(max-width:650px){.audio-controls{grid-template-columns:1fr}}


.settings-toggle-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}
.settings-panel{
  overflow:hidden;
  max-height:2000px;
  opacity:1;
  transform:translateY(0);
  transition:max-height .34s ease,opacity .22s ease,transform .28s ease,margin .28s ease;
}
.settings-panel.collapsed{
  max-height:0;
  opacity:0;
  transform:translateY(-8px);
  margin:0;
  pointer-events:none;
}
.settings-toggle{
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.focus-mode-note{
  font-size:12px;
  color:var(--muted);
  margin-left:8px;
}


/* ===== Focus layout / visual polish ===== */
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(91,108,255,.14),transparent 36%),
    linear-gradient(180deg,#070a12 0%,#0a1020 58%,#080c15 100%);
}
.app{max-width:1480px;margin:auto}
.main{
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:stretch;
}
.main>aside.panel{
  width:100%;
}
.main>main.panel{
  width:100%;
  max-width:1320px;
  margin:0 auto;
}
.main.library-hidden>aside.panel{display:none}
.main.library-hidden{display:flex}

aside.panel{
  background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(14,20,34,.96));
}
.song-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  overflow-y:hidden;
  max-height:none;
  padding:2px 2px 8px;
  scroll-snap-type:x proximity;
}
.song-card{
  min-width:210px;
  max-width:260px;
  flex:0 0 auto;
  scroll-snap-align:start;
}
.library-toolbar{
  grid-template-columns:minmax(220px,1fr) auto;
}
.sidebar-head{margin-bottom:10px}

main.panel{
  background:
    radial-gradient(circle at 50% 18%,rgba(99,112,255,.08),transparent 30%),
    linear-gradient(180deg,rgba(14,20,34,.98),rgba(9,14,25,.98));
  overflow:hidden;
}

.settings-toggle-row{
  justify-content:flex-end;
  min-height:42px;
}
.settings-panel{
  border-bottom:1px solid transparent;
}
.settings-panel:not(.collapsed){
  border-bottom-color:var(--line);
  padding-bottom:16px;
  margin-bottom:12px;
}

.status{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  min-height:160px;
  text-align:center;
  margin-top:2px;
}
.status>div:first-child{
  width:100%;
}
.current{
  font-size:clamp(58px,8vw,118px);
  line-height:.95;
  letter-spacing:.02em;
  text-align:center;
  color:#f8fbff;
  text-shadow:
    0 0 12px rgba(160,175,255,.36),
    0 0 34px rgba(111,126,255,.22),
    0 0 70px rgba(111,126,255,.13);
  transition:transform .18s ease,filter .18s ease,text-shadow .18s ease;
}
.current.pulse{
  transform:scale(1.06);
  filter:brightness(1.16);
  text-shadow:
    0 0 16px rgba(191,201,255,.7),
    0 0 46px rgba(116,132,255,.46),
    0 0 90px rgba(116,132,255,.25);
}
.status .small{
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  text-align:center;
  margin-bottom:12px;
}
.status .pill{
  position:absolute;
  top:8px;
  min-width:78px;
  opacity:.72;
  backdrop-filter:blur(10px);
  background:rgba(8,14,27,.55);
}
.status .pill:nth-of-type(2){right:180px}
.status .pill:nth-of-type(3){right:94px}
.status .pill:nth-of-type(4){right:8px}

.progress{
  max-width:760px;
  margin:0 auto 8px;
  opacity:.8;
}

.sequence-stage{
  margin:6px auto 18px;
  padding:10px 0 8px;
  width:100%;
  max-width:1080px;
  overflow:hidden;
  position:relative;
}
.sequence-label{
  text-align:center;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.sequence-viewport{
  position:relative;
  width:100%;
  height:116px;
  overflow:hidden;
  contain:layout paint size;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 88%,transparent 100%);
}
.sequence-viewport::before{
  content:"";
  position:absolute;
  left:50%;
  top:7px;
  bottom:7px;
  width:1px;
  background:linear-gradient(180deg,transparent,rgba(132,147,255,.55),transparent);
  transform:translateX(-50%);
  z-index:0;
  box-shadow:0 0 10px rgba(105,123,255,.25);
}
.sequence-track{
  position:absolute;
  left:0;
  top:0;
  display:flex;
  align-items:center;
  gap:34px;
  height:116px;
  width:max-content;
  padding:0;
  margin:0;
  transition:transform .38s cubic-bezier(.22,.61,.36,1);
  will-change:transform;
  z-index:1;
}
.seq-item{
  min-width:74px;
  text-align:center;
  color:#8290aa;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:18px;
  font-weight:700;
  opacity:.18;
  transform:scale(.8);
  transition:transform .3s cubic-bezier(.22,.61,.36,1),opacity .3s,color .3s,filter .3s;
  filter:blur(.25px);
}
.seq-item.near{opacity:.48;transform:scale(.9);filter:none}
.seq-item.current{
  min-width:130px;
  opacity:1;
  transform:scale(1.16);
  font-size:38px;
  font-weight:1000;
  color:#fbfcff;
  filter:none;
  text-shadow:
    0 0 14px rgba(167,178,255,.65),
    0 0 38px rgba(114,130,255,.34);
}
.seq-item.done{opacity:.08;transform:scale(.72)}
.seq-item.future{opacity:.24}
.sequence-marker{
  width:42px;
  height:3px;
  margin:0 auto;
  background:linear-gradient(90deg,transparent,#8d9aff,transparent);
  box-shadow:0 0 18px rgba(110,125,255,.55);
}

.info{
  max-width:1080px;
  margin:10px auto 0;
  opacity:.82;
}

.keyboard-shell{
  max-width:1240px;
  margin:28px auto 8px;
  padding:28px 24px 34px;
  border-radius:26px;
  background:
    radial-gradient(circle at 50% 0%,rgba(93,108,255,.11),transparent 28%),
    linear-gradient(180deg,#080d18,#070b12);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 18px 60px rgba(0,0,0,.34);
  overflow-x:auto;
}
.krow{
  gap:8px;
  margin-bottom:8px;
  justify-content:center;
}
.key{
  position:relative;
  height:64px;
  min-width:58px;
  border-radius:13px;
  transition:
    transform .08s ease,
    background .12s ease,
    box-shadow .14s ease,
    filter .14s ease;
}
.key::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  bottom:-14px;
  height:22px;
  border-radius:50%;
  opacity:0;
  background:radial-gradient(ellipse at center,rgba(117,135,255,.65),rgba(117,135,255,.18) 45%,transparent 72%);
  filter:blur(5px);
  pointer-events:none;
  transition:opacity .12s ease;
}
.key.target{
  outline:2px solid rgba(107,228,180,.78);
  outline-offset:1px;
  box-shadow:
    0 0 0 1px rgba(107,228,180,.22),
    0 0 24px rgba(79,218,166,.24),
    0 3px 0 rgba(0,0,0,.2);
}
.key.target::after{
  opacity:.35;
  background:radial-gradient(ellipse at center,rgba(90,238,184,.7),rgba(90,238,184,.15) 48%,transparent 72%);
}
.key.active{
  transform:translateY(4px) scale(.985);
  color:white;
  background:linear-gradient(180deg,#9aa7ff,#6979ee);
  box-shadow:
    0 0 16px rgba(125,140,255,.5),
    0 0 34px rgba(125,140,255,.25),
    inset 0 0 14px rgba(255,255,255,.14);
  filter:brightness(1.08);
}
.key.active::after{opacity:1}
.key.dark.active{
  background:linear-gradient(180deg,#6471d8,#39469f);
}
.note{font-size:10px;margin-top:4px}

@media(max-width:900px){
  .status .pill{position:static}
  .status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .status>div:first-child{grid-column:1/-1}
  .status .pill{min-width:0}
  .current{font-size:clamp(48px,15vw,84px)}
}
@media(max-width:650px){
  body{padding:10px}
  .song-card{min-width:180px}
  .keyboard-shell{padding:18px 14px 28px}
  .key{min-width:50px;height:58px}
  .sequence-track{gap:22px}
  .seq-item{min-width:58px;font-size:15px}
  .seq-item.current{min-width:96px;font-size:30px}
}


.practice-feedback{
  text-align:center;
  min-height:24px;
  margin-top:4px;
  font-size:13px;
  font-weight:800;
  color:var(--muted);
  transition:color .15s ease,transform .15s ease,opacity .15s ease;
}
.practice-feedback.ok{
  color:var(--good);
  transform:scale(1.04);
}
.practice-feedback.bad{
  color:var(--bad);
}
.practice-feedback.chord{
  color:#c7d0ff;
}


/* ===== Animated blurred background / particles ===== */
body{position:relative;overflow-x:hidden}
.fx-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:#060a12;
}
.fx-layer,.fx-glow,.fx-vignette,.particle-canvas{
  position:absolute;
  inset:-5%;
}
.fx-layer{
  background-image:url('./night_flower_bg.jpg');
  background-size:cover;
  background-position:center center;
  transform-origin:center center;
  will-change:transform,filter,opacity;
}
.fx-back{
  filter:blur(22px) brightness(.34) saturate(1.05);
  opacity:.7;
  transform:scale(1.18);
  animation:bgDriftBack 26s ease-in-out infinite alternate;
}
.fx-mid{
  filter:blur(8px) brightness(.5) saturate(1.12);
  opacity:.28;
  transform:scale(1.08);
  animation:bgDriftFront 18s ease-in-out infinite alternate;
}
.fx-glow{
  mix-blend-mode:screen;
  opacity:.18;
}
.fx-glow-1{
  background:
    radial-gradient(circle at 26% 72%, rgba(78,163,255,.54), transparent 28%),
    radial-gradient(circle at 68% 24%, rgba(113,127,255,.42), transparent 24%);
  filter:blur(34px);
  animation:glowFloat1 16s ease-in-out infinite alternate;
}
.fx-glow-2{
  background:
    radial-gradient(circle at 70% 70%, rgba(66,208,255,.38), transparent 22%),
    radial-gradient(circle at 40% 30%, rgba(129,149,255,.34), transparent 18%);
  filter:blur(48px);
  animation:glowFloat2 20s ease-in-out infinite alternate;
}
.fx-vignette{
  background:
    radial-gradient(circle at 50% 50%, transparent 0%, rgba(4,7,14,.08) 58%, rgba(4,7,14,.4) 100%),
    linear-gradient(180deg, rgba(5,7,13,.44), rgba(5,7,13,.12) 28%, rgba(5,7,13,.46) 100%);
}
.particle-canvas{
  width:100%;
  height:100%;
  opacity:.9;
}
.app{position:relative;z-index:1}
.hero,.panel{
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  background-clip:padding-box;
}
.hero{
  background:
    linear-gradient(135deg,rgba(125,140,255,.16),rgba(162,119,255,.08)),
    rgba(10,15,28,.55) !important;
}
.panel{
  background-color:rgba(11,17,29,.66) !important;
}
.keyboard-shell{
  background:
    radial-gradient(circle at 50% 0%,rgba(93,108,255,.11),transparent 28%),
    linear-gradient(180deg,rgba(8,13,24,.88),rgba(7,11,18,.92)) !important;
}
@keyframes bgDriftBack{
  0%{transform:scale(1.18) translate3d(-1.8%, -1.2%, 0)}
  50%{transform:scale(1.22) translate3d(1.4%, 1.1%, 0)}
  100%{transform:scale(1.16) translate3d(.4%, -1.8%, 0)}
}
@keyframes bgDriftFront{
  0%{transform:scale(1.08) translate3d(1.1%, .5%, 0)}
  50%{transform:scale(1.12) translate3d(-1.6%, -1.2%, 0)}
  100%{transform:scale(1.1) translate3d(.9%, 1.5%, 0)}
}
@keyframes glowFloat1{

function clampBpm(force=false){
 const raw=E.bpm.value.trim();

 // 입력 중에는 빈 값이나 1~2자리 숫자를 강제로 30/300으로 바꾸지 않는다.
 if(!force){
   if(raw===''){
     E.bpmView.textContent='—';
     return null;
   }
   const live=parseInt(raw,10);
   if(Number.isFinite(live)){
     E.bpmView.textContent=live;
     return live;
   }
   return null;
 }

 const parsed=parseInt(raw,10);
 const v=Math.max(30,Math.min(300,Number.isFinite(parsed)?parsed:120));
 E.bpm.value=v;
 E.bpmView.textContent=v;
 return v;
}

function parseTxt(text){
 const chunks=text.includes('### SONG ') ? text.split(/### SONG \d+ ###\s*/).filter(Boolean) : [text];
 const out=[];
 for(const c of chunks){
   if(!c.includes('# ROBLOX_PIANO_SONG'))continue;
   const sheetSplit=c.split('---SHEET---');
   if(sheetSplit.length<2)continue;
   const head=sheetSplit[0],sheet=sheetSplit.slice(1).join('---SHEET---').replace(/^\s*\n?/,'');
   const get=k=>{const m=head.match(new RegExp('^'+k+'=(.*)$','m'));return m?m[1].trim():''};
   const dec=v=>{try{return decodeURIComponent(v)}catch{return v}};
   out.push({id:uid(),title:dec(get('TITLE'))||'제목 없음',category:dec(get('LIST')),bpm:Math.max(30,Math.min(300,parseInt(get('BPM'))||120)),unit:get('UNIT')||'1',sheet,createdAt:nowISO(),updatedAt:nowISO()});

}

function initAudio(){
 if(!ac){
   ac=new (window.AudioContext||window.webkitAudioContext)();
   master=ac.createGain();
   dryGain=ac.createGain();
   wetGain=ac.createGain();
   convolver=ac.createConvolver();

   // Smooth generated hall-style impulse. The original OGG tail remains intact;
   // this bus only adds controllable room tail over the same sample.
   const seconds=3.4;
   const rate=ac.sampleRate;
   const length=Math.floor(rate*seconds);
   const impulse=ac.createBuffer(2,length,rate);
   for(let ch=0;ch<2;ch++){
     const data=impulse.getChannelData(ch);
     for(let i=0;i<length;i++){
       const t=i/length;
       const decay=Math.pow(1-t,2.35);
       data[i]=(Math.random()*2-1)*decay;
     }
   }
   convolver.buffer=impulse;

   dryGain.connect(master);
   convolver.connect(wetGain);
   wetGain.connect(master);
   master.connect(ac.destination);

   updateAudioMix();
 }
 if(ac.state==='suspended')ac.resume();
}

function updateAudioMix(){
 const volume=Math.max(0,Math.min(1,(parseFloat(E.volume?.value)||0)/100));
 const reverb=Math.max(0,Math.min(.6,(parseFloat(E.reverb?.value)||0)/100));
 if(master)master.gain.value=volume;
 if(dryGain)dryGain.gain.value=1;
 if(wetGain)wetGain.gain.value=reverb;
 if(E.volumeValue)E.volumeValue.textContent=Math.round(volume*100)+'%';
 if(E.reverbValue)E.reverbValue.textContent=Math.round(reverb*100)+'%';
}
async function getBuffer(note){
 initAudio();if(buffers.has(note))return buffers.get(note);
 const sf=window.MIDI&&window.MIDI.Soundfont&&window.MIDI.Soundfont.acoustic_grand_piano;
 if(!sf||!sf[note])throw new Error('SoundFont 음원을 찾지 못했습니다: '+note);
 const r=await fetch(sf[note]);const arr=await r.arrayBuffer();const b=await ac.decodeAudioData(arr.slice(0));buffers.set(note,b);return b;
}
async function noteOn(key,durationMs=null){
 if(!KEY_TO_NOTE[key])return;
 try{
   const b=await getBuffer(KEY_TO_NOTE[key]);
   const src=ac.createBufferSource(),g=ac.createGain();
   src.buffer=b;
   src.connect(g);
   g.connect(dryGain);
   g.connect(convolver);

   // Keep the SoundFont sample itself intact. No artificial note-shortening envelope.
   const n=ac.currentTime;
   g.gain.setValueAtTime(1,n);

   // 같은 키를 다시 눌러도 기존 잔향을 끊지 않고 겹쳐 울리게 한다.
   if(!voices.has(key)) voices.set(key,new Set());
   const voice={src,g};
   voices.get(key).add(voice);

   src.start(n);
   keyEls.get(key)?.classList.add('active');
   updateHeld();

   // 원본 OGG 샘플은 끝날 때까지 자연스럽게 재생한다.
   // durationMs는 키 하이라이트/악보 타이밍에만 사용하고 오디오는 자르지 않는다.
   if(durationMs){
     setTimeout(()=>{
       if(!pressed.has(key)) keyEls.get(key)?.classList.remove('active');
       updateHeld();
     },Math.max(40,durationMs));
   }

   src.onended=()=>{
     const set=voices.get(key);
     if(set){
       set.delete(voice);
       if(set.size===0) voices.delete(key);
     }
     if(!pressed.has(key)) keyEls.get(key)?.classList.remove('active');
     updateHeld();
   };
 }catch(err){
   console.error(err);
   E.status.textContent='음원 오류';
 }
}

// 일반 키업에서는 음원을 끊지 않는다.
// 실제 피아노처럼 이미 울린 샘플의 자연 감쇠를 그대로 남긴다.
function release(key,ms=260){
 if(!pressed.has(key)) keyEls.get(key)?.classList.remove('active');
 updateHeld();
}

// 정지 버튼에서만 모든 울림을 빠르게 페이드아웃한다.
function releaseAll(){
 if(!ac)return;
 const n=ac.currentTime;
 for(const [key,set] of voices){
   for(const voice of set){
     try{
       const cur=Math.max(.0001,voice.g.gain.value||.2);
       voice.g.gain.cancelScheduledValues(n);
       voice.g.gain.setValueAtTime(cur,n);
       voice.g.gain.exponentialRampToValueAtTime(.0001,n+.08);
       voice.src.stop(n+.10);
     }catch{}
   }
 }
 voices.clear();
 keyEls.forEach(el=>el.classList.remove('active'));
 updateHeld();
}

function updateHeld(){
 const keys=[...pressed].map(k=>k.toUpperCase());
 E.held.textContent=keys.length?keys.join(' + '):'—';
}

function buildKeyboard(){
 rows.forEach(row=>{
   const r=document.createElement('div');r.className='krow';
   row.forEach(([cap,cls])=>{

       k.addEventListener('pointerdown',()=>manualDown(cap));k.addEventListener('pointerup',()=>manualUp(cap));k.addEventListener('pointercancel',()=>manualUp(cap));
     }
     r.appendChild(k);
   });
   E.keyboard.appendChild(r);

function parseSheet(){
 const text=E.sheet.value.replace(/\n/g,' ');
 // Supported Roblox keys, including shifted black-note aliases.
 const validChars="1234567890qwertyuiopasdfghjklzxcvbnm!@$%^*(QWETYIOPSDGHJLZCVB";
 const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const charClass=esc(validChars);
 const rx=new RegExp('\\[(['+charClass+']+)\\](?:-+)?|['+charClass+'](?:-+)?','g');
 const raw=text.match(rx)||[];
 seq=raw.map(t=>{
   const chord=t.startsWith('[');
   const d=(t.match(/-/g)||[]).length;
   const inside=chord?t.slice(1,t.indexOf(']')):t[0];
   return{raw:t,keys:[...inside].filter(k=>KEY_TO_NOTE[k]),beats:1+d*.5};
 }).filter(x=>x.keys.length);
 if(idx>=seq.length)idx=0;
 practiceMatched.clear();
 if(E.sequenceTrack)E.sequenceTrack.dataset.signature='';
 render();
}
function renderSequence(){
 if(!E.sequenceTrack || !E.sequenceViewport)return;

 const signature=seq.map(x=>x.raw).join('\u0001');

 // Build the note lane only when the song/score actually changes.
 if(E.sequenceTrack.dataset.signature!==signature){
   E.sequenceTrack.dataset.signature=signature;
   E.sequenceTrack.innerHTML='';

   if(!seq.length){
     const empty=document.createElement('div');
     empty.className='seq-item current';
     empty.textContent='—';
     empty.dataset.index='0';
     E.sequenceTrack.appendChild(empty);
   }else{
     seq.forEach((s,i)=>{
       const item=document.createElement('div');
       item.className='seq-item future';
       item.dataset.index=String(i);
       item.textContent=s.raw.toUpperCase();
       E.sequenceTrack.appendChild(item);
     });
   }

   // First positioning should not animate in from the far left.
   E.sequenceTrack.style.transition='none';
 }

 const items=[...E.sequenceTrack.children];

 items.forEach((item,i)=>{
   item.classList.remove('current','near','done','future');
   const distance=Math.abs(i-idx);

   if(!seq.length){
     item.classList.add('current');
   }else if(i===idx){
     item.classList.add('current');
   }else{
     if(i<idx)item.classList.add('done');
     if(i>idx)item.classList.add('future');
     if(distance<=2)item.classList.add('near');
   }
 });

 requestAnimationFrame(()=>{
   const current=E.sequenceTrack.querySelector('.seq-item.current');
   if(!current)return;

   const viewportCenter=E.sequenceViewport.clientWidth/2;
   const currentCenter=current.offsetLeft+current.offsetWidth/2;
   const target=viewportCenter-currentCenter;

   requestAnimationFrame(()=>{
     E.sequenceTrack.style.transition='transform .42s cubic-bezier(.22,.61,.36,1)';
     E.sequenceTrack.style.transform=`translate3d(${target}px,0,0)`;
   });
 });
}

function render(){
 keyEls.forEach(el=>el.classList.remove('target'));const x=seq[idx];
 if(x){
   E.current.textContent=x.raw.toUpperCase();
   E.nextNote.textContent=seq[idx+1]?.raw.toUpperCase()||'끝';
   x.keys.forEach(k=>keyEls.get(k)?.classList.add('target'));
   E.current.classList.remove('pulse');
   void E.current.offsetWidth;
   E.current.classList.add('pulse');
   setTimeout(()=>E.current.classList.remove('pulse'),180);
 }else{
   E.current.textContent='—';
   E.nextNote.textContent='—';
 }
 E.count.textContent=`${seq.length?Math.min(idx+1,seq.length):0} / ${seq.length}`;
 E.progress.style.width=(seq.length?Math.min(100,idx/seq.length*100):0)+'%';
 renderSequence();
 clampBpm();
}
function stepMs(x){return (60000/clampBpm())*(parseFloat(E.unit.value)||1)*x.beats}
function playStep(){
 clearTimeout(timer);if(!playing||!seq.length)return;
 if(idx>=seq.length){playing=false;releaseAll();E.status.textContent='완료';E.progress.style.width='100%';return}
 render();const x=seq[idx],ms=Math.max(70,stepMs(x));E.status.textContent='재생 중';
 x.keys.forEach(k=>noteOn(k,ms*.92));timer=setTimeout(()=>{x.keys.forEach(k=>{if(!pressed.has(k))keyEls.get(k)?.classList.remove('active')});idx++;practiceMatched.clear();playStep()},ms);
}
function stopPlayback(reset=true){playing=false;clearTimeout(timer);releaseAll();if(reset){idx=0;practiceMatched.clear();}render();E.status.textContent=reset?'정지':'대기';if(reset)setPracticeFeedback('현재 강조된 키를 눌러 진행하세요.');}

function setPracticeFeedback(text,type=''){
 if(!E.practiceFeedback)return;
 E.practiceFeedback.textContent=text;
 E.practiceFeedback.classList.remove('ok','bad','chord');
 if(type)E.practiceFeedback.classList.add(type);
}

function advancePracticeStep(){
 if(advanceLock)return;
 advanceLock=true;

 const old=seq[idx];
 if(old) old.keys.forEach(k=>keyEls.get(k)?.classList.remove('target'));

 idx++;
 practiceMatched.clear();

 if(idx>=seq.length){
   idx=seq.length;
   E.progress.style.width='100%';
   E.current.textContent='완료';
   E.nextNote.textContent='끝';
   E.count.textContent=`${seq.length} / ${seq.length}`;
   keyEls.forEach(el=>el.classList.remove('target'));
   renderSequence();
   setPracticeFeedback('곡 끝! 잘했어요.','ok');
   setTimeout(()=>advanceLock=false,180);
   return;
 }

 render();
 setPracticeFeedback('좋아요 — 다음 음','ok');
 setTimeout(()=>{
   advanceLock=false;
   if(E.practiceFeedback?.classList.contains('ok')){
     setPracticeFeedback('현재 강조된 키를 눌러 진행하세요.');
   }
 },180);
}

function judgePracticeKey(k){
 if(playing || advanceLock || !seq.length || idx>=seq.length)return;

 const item=seq[idx];
 if(!item)return;

 if(!item.keys.includes(k)){
   setPracticeFeedback(`${k.toUpperCase()} · 다른 키예요`,'bad');

   const wrongKey=keyEls.get(k);
   if(wrongKey){
     wrongKey.classList.remove('wrong');
     void wrongKey.offsetWidth;
     wrongKey.classList.add('wrong');
     setTimeout(()=>wrongKey.classList.remove('wrong'),320);
   }

   E.current.classList.remove('wrong');
   void E.current.offsetWidth;
   E.current.classList.add('wrong');

   setTimeout(()=>{
     E.current.classList.remove('wrong');
     if(!playing) setPracticeFeedback('현재 강조된 키를 눌러 진행하세요.');
   },420);
   return;
 }

 practiceMatched.add(k);

 // Single note: advance immediately.
 if(item.keys.length===1){
   advancePracticeStep();
   return;
 }

 // Chord: accept keys in any order and advance after all required notes were pressed.
 const remaining=item.keys.filter(x=>!practiceMatched.has(x));
 if(remaining.length===0){
   advancePracticeStep();
 }else{
   setPracticeFeedback(
     `화음 ${practiceMatched.size}/${item.keys.length} · ${remaining.map(x=>x.toUpperCase()).join(' + ')} 남음`,
     'chord'
   );
 }
}

function manualDown(k){
 if(pressed.has(k))return;
 pressed.add(k);
 noteOn(k);
 judgePracticeKey(k);
}

function manualUp(k){pressed.delete(k);keyEls.get(k)?.classList.remove('active');updateHeld()}

E.saveSong.addEventListener('click',saveSong);E.deleteSong.addEventListener('click',deleteSong);
E.newSong.addEventListener('click',openSongModal);E.search.addEventListener('input',renderLibrary);


E.workspaceToggle.addEventListener('click',()=>{
 const main=document.querySelector('.main');
 const opening=main.classList.contains('library-hidden') || E.settingsPanel.classList.contains('collapsed');

 if(opening){
   main.classList.remove('library-hidden');
   E.settingsPanel.classList.remove('collapsed');
 }else{
   main.classList.add('library-hidden');
   E.settingsPanel.classList.add('collapsed');
 }

 const label=E.workspaceToggle.querySelector('.workspace-label');
 const icon=E.workspaceToggle.querySelector('.btn-icon');

 if(label)label.textContent=opening?'설정 · 라이브러리 닫기':'설정 · 라이브러리 열기';
 if(icon)icon.textContent=opening?'✕':'⚙';
});

E.cancelSongModal.addEventListener('click',closeSongModal);
E.saveSongModal.addEventListener('click',saveSongFromModal);
E.songModal.addEventListener('pointerdown',e=>{
 if(e.target===E.songModal)closeSongModal();
});
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!E.songModal.classList.contains('hidden')){
   closeSongModal();
 }
});
E.saveTxt.addEventListener('click',exportCurrent);E.exportAll.addEventListener('click',exportAll);
E.importTxt.addEventListener('click',()=>E.fileInput.click());E.fileInput.addEventListener('change',()=>{importFiles([...E.fileInput.files]);E.fileInput.value=''});
E.play.addEventListener('click',()=>{parseSheet();if(!seq.length){E.status.textContent='악보 없음';return}playing=true;practiceMatched.clear();setPracticeFeedback('자동 재생 중');initAudio();playStep()});
E.pause.addEventListener('click',()=>{playing=false;clearTimeout(timer);practiceMatched.clear();E.status.textContent='직접 연습';setPracticeFeedback('직접 눌러서 이어서 진행할 수 있어요.');});
E.stop.addEventListener('click',()=>stopPlayback(true));
E.slower.addEventListener('click',()=>{
  const cur=clampBpm(true);
  E.bpm.value=Math.max(30,cur-5);
  clampBpm(true);
  E.status.textContent='속도 ↓';
  if(playing){clearTimeout(timer);playStep()}
});
E.faster.addEventListener('click',()=>{
  const cur=clampBpm(true);
  E.bpm.value=Math.min(300,cur+5);
  clampBpm(true);
  E.status.textContent='속도 ↑';
  if(playing){clearTimeout(timer);playStep()}
});
E.sheet.addEventListener('input',()=>{if(!playing){idx=0;parseSheet()}});E.bpm.addEventListener('input',()=>clampBpm(false));
E.bpm.addEventListener('change',()=>clampBpm(true));
E.bpm.addEventListener('blur',()=>clampBpm(true));

window.addEventListener('keydown',e=>{
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 const k=e.key;
 if(KEY_TO_NOTE[k]&&!e.repeat){e.preventDefault();manualDown(k)}
});
window.addEventListener('keyup',e=>{const k=e.key;if(KEY_TO_NOTE[k])manualUp(k)});

E.volume.addEventListener('input',()=>{initAudio();updateAudioMix()});
E.reverb.addEventListener('input',()=>{initAudio();updateAudioMix()});
updateAudioMix();

buildKeyboard();loadLibrary();clampBpm(true);renderSequence();setPracticeFeedback('현재 강조된 키를 눌러 진행하세요.');
</script>
